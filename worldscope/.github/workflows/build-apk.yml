name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Deployed WorldScope URL (https://...vercel.app)'
        required: true
  release:
    types: [published]
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ github.event.inputs.site_url || vars.WORLDSCOPE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: Build web app
        run: npm run build
      - name: Create Android project
        run: |
          npm i --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          node scripts/android-config.js
          npx cap add android
          npx cap sync android
      - name: Apply WorldScope icon
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in $RES/mipmap-*; do
            cp public/icons/icon-192.png $d/ic_launcher.png
            cp public/icons/icon-192.png $d/ic_launcher_round.png
            rm -f $d/ic_launcher_foreground.png
          done
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: WorldScope-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
